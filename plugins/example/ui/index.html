<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Example notes</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <p id="status" role="status"></p>
      <p id="colleagues" class="meta"></p>
      <div class="row">
        <button id="navigate" class="primary" data-text="open">Open notes</button>
        <button id="prompt" data-text="ask">Ask the assistant</button>
        <button id="refresh" data-text="refresh">Refresh token</button>
      </div>
      <section id="picture">
        <h2 data-text="pictureTitle">A note with a picture</h2>
        <label class="file">
          <span data-text="choose">Choose a picture</span>
          <input id="picture-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        </label>
        <p id="picture-status" class="meta"></p>
        <img id="picture-preview" alt="" hidden />
        <div class="row">
          <button id="picture-describe" hidden data-text="describe">Describe it</button>
          <button id="picture-clear" hidden data-text="clear">Delete note</button>
        </div>
        <p id="picture-description"></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
