<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Example notes</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Example notes</h1>
      <p>A small plugin page served by Greenhouse.</p>
      <p id="status">Ready for the host.</p>
      <p id="colleagues"></p>
      <button id="navigate">Open notes</button>
      <button id="prompt">Ask the assistant</button>
      <button id="refresh">Refresh token</button>
      <section id="picture">
        <h2>A note with a picture</h2>
        <input id="picture-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        <p id="picture-status"></p>
        <img id="picture-preview" alt="" hidden />
        <button id="picture-describe" hidden>Describe it</button>
        <p id="picture-description"></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
