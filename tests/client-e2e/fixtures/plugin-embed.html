<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plugin fixture</title>
  </head>
  <body>
    <h1>Embed fixture</h1>
    <pre id="state"></pre>
    <button id="navigate">Navigate</button><button id="prompt">Draft prompt</button
    ><button id="refresh">Refresh token</button>
    <script>
      window.received = [];
      addEventListener('message', (event) => {
        let message = event.data;
        try {
          if (typeof message === 'string') message = JSON.parse(message);
        } catch {
          return;
        }
        if (!message?.type?.startsWith('greenhouse:')) return;
        window.received.push(message);
        document.querySelector('#state').textContent = JSON.stringify(window.received);
        if (message.type === 'greenhouse:init') document.documentElement.dataset.theme = message.theme;
        if (message.type === 'greenhouse:theme') document.documentElement.dataset.theme = message.theme;
      });
      document.querySelector('#navigate').onclick = () =>
        parent.postMessage({ type: 'greenhouse:navigate', href: '/knowledge' }, '*');
      document.querySelector('#prompt').onclick = () =>
        parent.postMessage({ type: 'greenhouse:sendPrompt', text: '请整理这位客户的资料' }, '*');
      document.querySelector('#refresh').onclick = () => parent.postMessage({ type: 'greenhouse:token-refresh' }, '*');
      parent.postMessage({ type: 'greenhouse:ready' }, '*');
      parent.postMessage({ type: 'greenhouse:title', title: '客户工作台 · 已连接' }, '*');
    </script>
  </body>
</html>
