      - 立即出「需要你完成人机验证」卡并结束本轮
      - 用户在卡片里点「在这里验证」接管电脑，完成后点「完成，交还」
      - Bot 继续
    deliverable:
      - 不尝试破解或绕过
      - 卡片说清楚是哪个站点、要做什么
      - 交还后能接着把报表数据拿下来
    focus:
      - 人机验证规则
      - 断点续做

