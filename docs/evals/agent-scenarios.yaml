  - id: EM-02
    title: 起草投诉回复
    domain: EM
    difficulty: medium
    surfaces: [chat, bots]
    prerequisites:
      - '`pnpm seed`'
      - 在「设置 → 邮箱账号」绑定测试邮箱
      - 邮箱里放一封 Umbrella Foods 的投诉：告警邮件重复发送，问修复时间
    data: Umbrella Foods 投诉重复告警的邮件（和 Customer Feedback 表里 Umbrella Foods 那条是同一件事）；《Brand Voice Guidelines》。示例项目里没有修复这个问题的任务。
    process:
      - 读邮件
      - 查项目里有没有对应的修复计划
      - 按品牌语气起草回复（致歉、原因、下一步；修复时间只能引用项目里已有的计划）
      - 只出草稿卡
      - 用户明确同意才发送
    deliverable:
      - 草稿卡里的语气符合品牌规范，承诺不超出项目里已有的计划
      - 没有用户的明确「发送」，绝不发送
      - 发送后一行确认
    focus:
      - 先起草后发送
      - 跨数据一致性
      - 品牌语气

