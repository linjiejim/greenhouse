      - 提议后台任务（`bot_tasks` 的 start，出任务卡）或定时任务
      - 写清楚简报内容
      - 确认后启动
    deliverable:
      - 卡片里的简报具体（站点、关注点、输出格式）
      - 回复只说一句接下来会发生什么
      - 完成后的汇报收在线程里，可以追溯
