<template>
  <style>
    #root { position: absolute; inset: 0; }
    #ask-view {
      position: absolute; left: 120px; top: 236px; width: 1680px; height: 790px;
      overflow: hidden; border-radius: 24px; background: #fff; border: 1px solid #dde3df;
      box-shadow: 0 40px 80px -40px rgba(28, 28, 30, 0.35);
    }
    #ask-cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
    #ask-cam img { display: block; width: 1440px; height: 900px; }
  </style>
  <div id="root" data-composition-id="ask" data-width="1920" data-height="1080">
    <div id="ask-view" class="clip" data-start="0" data-duration="6" data-layout-allow-overflow>
      <div id="ask-cam"><img src="assets/screens/chat-tables-answer.png" alt="" /></div>
    </div>
  </div>
  <script>
    (function () {
      // Frame a rectangle of the 1440 x 900 capture inside the 1680 x 790 window.
      function frame(l, t, w, h, cap) {
        const s = Math.min(1680 / w, 790 / h, cap || 2);
        let x = -l * s + (1680 - w * s) / 2;
        let y = -t * s + (790 - h * s) / 2;
        x = 1440 * s >= 1680 ? Math.min(0, Math.max(1680 - 1440 * s, x)) : (1680 - 1440 * s) / 2;
        y = 900 * s >= 790 ? Math.min(0, Math.max(790 - 900 * s, y)) : (790 - 900 * s) / 2;
        return { x, y, scale: s };
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ask-cam", frame(430, 190, 920, 260), { ...frame(430, 190, 920, 260), duration: 2.9, ease: "none" }, 0);
      tl.to("#ask-cam", { ...frame(0, 60, 1440, 677), duration: 0.95, ease: "power2.inOut" }, 2.9);
      // whip out toward the next shot
      tl.to("#ask-cam", { x: "-=900", filter: "blur(14px)", duration: 0.28, ease: "power3.in" }, 5.72);
      window.__timelines["ask"] = tl;
    })();
  </script>
