<template>
  <style>
    #root { position: absolute; inset: 0; }
    #cite-view {
      position: absolute; left: 120px; top: 236px; width: 1680px; height: 790px;
      overflow: hidden; border-radius: 24px; background: #fff; border: 1px solid #dde3df;
      box-shadow: 0 40px 80px -40px rgba(28, 28, 30, 0.35);
    }
    .cite-cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
    .cite-cam img { display: block; width: 1440px; height: 900px; }
    #cite-doc { opacity: 0; }
    #cite-mark { position: absolute; left: 500px; top: 300px; width: 150px; height: 5px; border-radius: 3px; background: #b6ca68; opacity: 0; transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="cite" data-width="1920" data-height="1080">
    <div id="cite-view" class="clip" data-start="0" data-duration="6" data-layout-allow-overflow>
      <div id="cite-answer" class="cite-cam">
        <img src="assets/screens/chat-knowledge-answer.png" alt="" />
        <div id="cite-mark"></div>
      </div>
      <div id="cite-doc" class="cite-cam"><img src="assets/screens/knowledge.png" alt="" /></div>
    </div>
  </div>
  <script>
    (function () {
      function frame(l, t, w, h, cap) {
        const s = Math.min(1680 / w, 790 / h, cap || 2);
        let x = -l * s + (1680 - w * s) / 2;
        let y = -t * s + (790 - h * s) / 2;
        x = 1440 * s >= 1680 ? Math.min(0, Math.max(1680 - 1440 * s, x)) : (1680 - 1440 * s) / 2;
        y = 900 * s >= 790 ? Math.min(0, Math.max(790 - 900 * s, y)) : (790 - 900 * s) / 2;
        return { x, y, scale: s };
      }
      const answer = frame(400, 100, 1000, 600);
      const chip = frame(420, 240, 560, 120);
      const doc = frame(560, 30, 860, 640);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cite-answer", { ...answer, scale: answer.scale * 1.25, x: answer.x - 300, y: answer.y - 120, filter: "blur(10px)" }, { ...answer, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
      tl.to("#cite-answer", { ...chip, duration: 0.85, ease: "power2.inOut" }, 1.6);
      tl.fromTo("#cite-mark", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, 2.35);
      // zoom through the citation into the document it names
      tl.to("#cite-answer", { scale: chip.scale * 3.2, x: chip.x * 3.2 - 1680, y: chip.y * 3.2 - 790, filter: "blur(10px)", opacity: 0, duration: 0.35, ease: "power3.in" }, 3.0);
      tl.fromTo("#cite-doc", { ...doc, scale: doc.scale * 1.08, x: doc.x - 60, y: doc.y - 30, opacity: 0 }, { ...doc, opacity: 1, duration: 0.55, ease: "expo.out" }, 3.25);
      window.__timelines["cite"] = tl;
    })();
  </script>
</template>
