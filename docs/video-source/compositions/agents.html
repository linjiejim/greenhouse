  <script>
    (function () {
      function frame(l, t, w, h, cap) {
        const s = Math.min(1680 / w, 790 / h, cap || 2);
        let x = -l * s + (1680 - w * s) / 2;
        let y = -t * s + (790 - h * s) / 2;

        return { x, y, scale: s };
      }

      const connect = frame(490, 150, 720, 90);
