<template>
  <style>
    #root { position: absolute; inset: 0; }
    #record-view {
      position: absolute; left: 120px; top: 236px; width: 1680px; height: 790px;
      overflow: hidden; border-radius: 24px; background: #fff; border: 1px solid #dde3df;
      box-shadow: 0 40px 80px -40px rgba(28, 28, 30, 0.35);
    }
    .record-cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
    .record-cam img { display: block; width: 1440px; height: 900px; }
    #record-budget { opacity: 0; }
    #record-mark { position: absolute; left: 513px; top: 392px; width: 166px; height: 5px; border-radius: 3px; background: #b6ca68; opacity: 0; transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="record" data-width="1920" data-height="1080">
    <div id="record-view" class="clip" data-start="0" data-duration="6" data-layout-allow-overflow>
      <div id="record-log" class="record-cam"><img src="assets/screens/admin-activity.png" alt="" /></div>
      <div id="record-budget" class="record-cam">
        <img src="assets/screens/my-agents.png" alt="" />
        <div id="record-mark"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function frame(l, t, w, h, cap) {
        const s = Math.min(1680 / w, 790 / h, cap || 2);
        let x = -l * s + (1680 - w * s) / 2;
        let y = -t * s + (790 - h * s) / 2;
        x = 1440 * s >= 1680 ? Math.min(0, Math.max(1680 - 1440 * s, x)) : (1680 - 1440 * s) / 2;
        y = 900 * s >= 790 ? Math.min(0, Math.max(790 - 900 * s, y)) : (790 - 900 * s) / 2;
        return { x, y, scale: s };
      }
      const log = frame(356, 40, 1064, 420);
      const budget = frame(500, 255, 700, 160);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#record-log", { ...log, y: log.y + 420, filter: "blur(10px)" }, { ...log, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
      tl.to("#record-log", { ...frame(356, 100, 1064, 420), duration: 1.6, ease: "power2.inOut" }, 0.9);
      // hard cut to the budget line, arriving slightly large and settling
      tl.set("#record-log", { opacity: 0 }, 3.0);
      tl.fromTo("#record-budget", { ...budget, scale: budget.scale * 1.06, opacity: 1 }, { ...budget, opacity: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 3.0);
      tl.fromTo("#record-mark", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, 3.6);
      window.__timelines["record"] = tl;
    })();
  </script>
</template>
