name: Release Please

# Version automation for the v1 line (branch `v1`; main carries v2). On every push
# to v1, release-please reads the Conventional
# Commits since the last tag and maintains a "Release PR" (computed SemVer bump +
# generated CHANGELOG.md). Merging that PR tags `vX.Y.Z` and creates the GitHub
# Release — which is what triggers release.yml to build & publish the artifacts.
# See RELEASING.md. Fork-safe: only runs in this repository, so a fork's main never
# grows Release PRs or tags it did not ask for.
on:
  push:
    branches: [v1]

permissions:
  contents: write
  pull-requests: write

# One release train at a time; never cancel a run mid-tag.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    steps:
      # A tag pushed by the default GITHUB_TOKEN does NOT cascade to other workflows
      # (GitHub's recursion guard), so release.yml's `on: push: tags` never fires for
      # a release-please tag. A PAT (RELEASE_PLEASE_TOKEN, contents+PRs write) makes
      # the tag push trigger release.yml → stable image + browser zip, automatically.
      # Falls back to GITHUB_TOKEN when the secret is absent: releases still tag &
      # publish notes, but the stable artifacts must then be published by re-pushing
      # the tag manually (RELEASING.md → "Publishing stable artifacts"). Add the PAT
      # to make releases fully hands-off.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: v1
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A new GitHub Release becomes the repository's "Latest" by default, and the
      # v2 line's README (main) installs its desktop app from releases/latest. Latest
      # belongs to the newest v2+ release, so hand it back after every v1 release.
      - name: Keep Latest on the newest v2+ release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | select((ltrimstr("v") | split(".")[0] | tonumber) >= 2)] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          fi
