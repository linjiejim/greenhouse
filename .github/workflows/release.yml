name: Release

# Builds & publishes the distributable artifacts. Two triggers:
#   • tag `v*`  → STABLE release: GHCR image `:X.Y.Z` `:X.Y` `:latest`
#                 (pre-release tags `-rc.N` get only their own tag).
#   • push main → EDGE build: GHCR image `:edge` + `:main-<sha>` only. Never
#                 `:latest`, never a Release asset — main is explicitly unstable.
# The stable/edge split is the machine-readable half of the promise in the README
# "Releases & stability" section. See RELEASING.md.
# Fork-safe: the job only runs in this repository — a fork's main never publishes
# images from here (its own CD lives in `fork-*.yml`).
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── API + web → single container image on GHCR ──
  image:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags + OCI labels from the git ref.
      #   tag v3.0.1      → 3.0.1, 3.0, latest
      #   tag v3.0.1-rc.1 → 3.0.1-rc.1
      #   push main       → edge, main-<sha>
      # `latest=auto` (the action's default) adds `latest` to non-prerelease semver tags only.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only for now: the `compute` tool's isolated-vm native addon must
          # be verified to cross-compile on arm64 before adding linux/arm64 here
          # (buildx + QEMU). Tracked in RELEASING.md → "Follow-ups".
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
