name: Release

# Builds & publishes the distributable artifacts. Two triggers:
#   • tag `v*`  → STABLE release: GHCR image `:X.Y.Z` `:X.Y` (+ `:latest` for a
#                 non-prerelease tag) and the browser extension zip attached to
#                 the GitHub Release.
#   • push main → EDGE build: GHCR image `:edge` + `:main-<sha>` only. Never
#                 `:latest`, never a Release asset — main is explicitly unstable.
# The stable/edge split is the machine-readable half of the promise in the README
# "Releases & stability" section. See RELEASING.md.
# Fork-safe: both jobs only run in this repository — a fork's main never publishes
# images or Release assets from here (its own CD lives in `fork-*.yml`).
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── API + web → one multi-arch container image on GHCR ──
  # Each platform builds natively on its own runner (no QEMU: the `compute`
  # tool's isolated-vm addon compiles from source) and pushes by digest; the
  # `image` job then stitches the digests into one tagged manifest list.
  image-build:
    if: github.repository == 'linjiejim/greenhouse'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same rules as the `image` job below; here only the version (build stamp)
      # and the OCI labels are used — tags are applied to the merged manifest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    if: github.repository == 'linjiejim/greenhouse'
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags + OCI labels from the git ref.
      #   tag v0.2.0     → 0.2.0, 0.2, latest
      #   tag v0.2.0-rc.1 → 0.2.0-rc.1            (prerelease: no `latest`)
      #   push main      → edge, main-<sha>
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Create the multi-arch manifest and push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # intended splitting: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      # Optional copy for networks where GHCR / Docker Hub are slow or blocked
      # (mainland China): set the repository variable MIRROR_PREFIX (e.g.
      # `registry.cn-hangzhou.aliyuncs.com/<namespace>`) and the secrets
      # MIRROR_USERNAME / MIRROR_PASSWORD. Stable releases only — edge builds
      # would fill the mirror. The installer's `--mirror <prefix>` pulls
      # greenhouse, postgres and caddy from there.
      - name: Mirror registry host
        id: mirror
        if: vars.MIRROR_PREFIX != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          MIRROR_PREFIX: ${{ vars.MIRROR_PREFIX }}
        run: echo "host=${MIRROR_PREFIX%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the mirror registry
        if: steps.mirror.outputs.host != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.mirror.outputs.host }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: Copy the release to the mirror registry
        if: steps.mirror.outputs.host != ''
        env:
          MIRROR_PREFIX: ${{ vars.MIRROR_PREFIX }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create -t "${MIRROR_PREFIX}/greenhouse:${tag##*:}" "$tag"
          done
          # The images docker-compose.ghcr.yml and the installer's HTTPS option need.
          docker buildx imagetools create -t "${MIRROR_PREFIX}/postgres:16-alpine" docker.io/library/postgres:16-alpine
          docker buildx imagetools create -t "${MIRROR_PREFIX}/caddy:2-alpine" docker.io/library/caddy:2-alpine

  # ── Browser extension → versioned zip attached to the Release (stable only) ──
  browser:
    if: github.repository == 'linjiejim/greenhouse' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset to the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `package` runs `vite build` then stamps manifest.version from APP_VERSION
      # and zips dist/ → greenhouse-bridge-vX.Y.Z.zip.
      - name: Build & package extension
        run: pnpm --filter @greenhouse/browser package
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Attach zip to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" apps/browser/greenhouse-bridge-*.zip --clobber
