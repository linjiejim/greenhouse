name: CI

# Quality gate (lint / typecheck / test / e2e / secret-scan) for the default
# branch and all PRs. This workflow never deploys — but deploy.yml polls it and
# only rolls jim-server once it passes on the same sha.
#
# Gated to this repository like every other workflow here. An overlay fork carries
# extensions whose tables this file never migrates, and is usually an organisation,
# where gitleaks-action needs a licence — on a fork these jobs could only fail.
# Forks run their own gate (fork-ci.yml, see EXTENDING.md); pull requests to this
# repository still run here whichever fork they come from.
on:
  push:
    branches: [main, v1, v3]
  pull_request:

jobs:
  hosted-client:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --dir apps/client install --ignore-workspace --frozen-lockfile
      - run: pnpm app:build
      - name: Verify the hosted client
        run: test -f public/app/index.html && grep -q 'rel="manifest"' public/app/index.html

  lint:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    # tsc checks the whole monorepo in one program and peaks above 2 GB. Node
    # sizes its default old-space from visible memory, and on this runner that
    # default sits close enough to the peak to tip over (`Reached heap limit`,
    # exit 134) while the same tree typechecks clean locally. Pin the ceiling.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenhouse_test
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: greenhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenhouse -d greenhouse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Build the test DB via `migrate` (NOT push) so the migration chain is
      # exercised on every run — a broken/incomplete chain fails CI here
      # instead of silently diverging from push.
      - name: Apply migrations to test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_test
      - run: pnpm test

  core:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    env:
      GREENHOUSE_PLUGINS: ''
      GREENHOUSE_EXTENSIONS: ''
      TEST_DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_core_test
      DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_core_test
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenhouse_core_test
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: greenhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenhouse -d greenhouse_core_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:core

  # Live-server integration/security suite (tests/e2e). Boots the real API and
  # drives it over HTTP — the layer `pnpm test` (in-process units) never reaches:
  # auth/token round-trips, cross-user data isolation, role escalation, injection,
  # tool-access & v1 API boundaries. Runs against a dead LLM endpoint so it stays
  # deterministic and free (E2E_NO_LLM skips the few content-dependent assertions).
  e2e:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenhouse_test
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: greenhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenhouse -d greenhouse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations to test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_test
      - name: Run live-server E2E suite
        run: pnpm test:e2e:ci
        env:
          DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_test

  # Browser suite: the universal client (tests/client-e2e) against a real API.
  # Expo web and the API boot from playwright.client.config.ts; the LLM endpoint
  # refuses connections so nothing real is ever called (chat specs stub the stream).
  client-e2e:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenhouse_test
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: greenhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenhouse -d greenhouse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_test
      CLIENT_E2E_DATABASE: postgresql://greenhouse:greenhouse@localhost:5432/greenhouse_test
      GREENHOUSE_EXTENSIONS: all
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --dir apps/client install --ignore-workspace --frozen-lockfile
      - name: Apply migrations to test database
        run: pnpm db:migrate
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser suite
        run: pnpm test:e2e:client
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Secret scanning (gitleaks) — blocks newly-leaked credentials on every PR/push.
  # Rules + allowlist live in .gitleaks.toml at the repo root. Full history was
  # verified clean once locally; this gate scans incoming commits. Public repo, so
  # gitleaks-action needs no license key.
  secret-scan:
    if: github.repository == 'linjiejim/greenhouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can diff commit / PR ranges
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
