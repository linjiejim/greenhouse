<!doctype html>
<html lang="en" class="theme-loading">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable=no / maximum-scale=1: page zoom is disabled globally by
      product decision. iOS Safari ignores both directives (they only take effect
      on Android Chrome and similar); accidental zoom from double-tap is handled
      separately by `html { touch-action: manipulation }` in app.css.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual, maximum-scale=1, user-scalable=no"
    />
    <title>Greenhouse</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D9488" />
  </head>
  <body class="bg-surface-sunken text-fg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
