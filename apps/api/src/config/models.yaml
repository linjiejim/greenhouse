# ─────────────────────────────────────────────────────────────────────────────
# Model catalog — the single definition of every model this deployment can use.
#
# Consumed by BOTH the chat/agent runtime (profiles reference these ids) and the
# outbound OpenAI-compatible relay at /api/llm. There is no second catalog and
# no database copy: change a model here, redeploy, done.
#
# SECRETS NEVER LIVE HERE. Each provider names the env var holding its key
# (`api_key_env`); a provider whose env var is unset is silently skipped, so the
# chain below doubles as an ordered fallback list. `model_env` / `base_url_env`
# name env vars holding the model id / endpoint, so the two built-in ids work
# against ANY OpenAI-compatible endpoint straight from `.env`:
#
#   LLM_BASE_URL=https://api.deepseek.com   LLM_API_KEY=…   LLM_MODEL=deepseek-v4-flash
#   LLM_MODEL_PRO=deepseek-v4-pro           (optional stronger model, same endpoint)
#
# `options` are the MODEL's sampling/reasoning behavior, not an agent's — every
# consumer of a model gets them.
# ─────────────────────────────────────────────────────────────────────────────

# `context_window` is the model's max context in tokens — declare the MINIMUM
# across the provider chain, not the primary's. It feeds the per-model chat
# history budget: history is compacted (oldest messages dropped from the
# payload; the DB transcript is never touched) once it exceeds
# `context_window × compaction_threshold`. `compaction_threshold` is optional
# and defaults to 0.5; keep it ≤0.9 so system prompt + tools + reasoning +
# output always have room. Models without `context_window` fall back to a
# conservative 80k-token budget.

models:
  # The deployment's default fast model — whatever LLM_MODEL points at.
  flash:
    name: Default model
    context_window: 128000
    options:
      temperature: 0.4
      max_tokens: 16000
    providers:
      - provider: openai-compatible
        model_env: LLM_MODEL
        api_key_env: LLM_API_KEY
        base_url_env: LLM_BASE_URL

  # An optional stronger model on the same endpoint (LLM_MODEL_PRO). Hidden from
  # the picker until the variable is set.
  pro:
    name: Stronger model
    context_window: 128000
    options:
      temperature: 0.4
      max_tokens: 16000
    providers:
      - provider: openai-compatible
        model_env: LLM_MODEL_PRO
        api_key_env: LLM_API_KEY
        base_url_env: LLM_BASE_URL

  # DeepSeek native provider (DSML tool-call recovery, reasoning). Optional:
  # invisible until DEEPSEEK_API_KEY is configured.
  deepseek-flash:
    name: DeepSeek V4 Flash
    context_window: 1000000
    options:
      thinking: true
      temperature: 0.4
      max_tokens: 20000
    providers:
      - provider: deepseek
        model: deepseek-v4-flash
        api_key_env: DEEPSEEK_API_KEY

  deepseek-pro:
    name: DeepSeek V4 Pro
    context_window: 1000000
    options:
      thinking: true
      temperature: 0.4
      max_tokens: 20000
    providers:
      - provider: deepseek
        model: deepseek-v4-pro
        api_key_env: DEEPSEEK_API_KEY

  # Kimi K3 on the Kimi Code subscription (`https://api.kimi.com/coding/v1`,
  # key from the Kimi Code Console — NOT a Kimi Open Platform key). Reasoning
  # always on; no fallback chain on purpose (nobody else serves this model).
  kimi-k3:
    name: Kimi K3
    context_window: 262144
    options:
      # K3 always reasons; `high` keeps chat latency and plan quota sane.
      reasoning_effort: high
      max_tokens: 20000
      # No `temperature`: Kimi pins sampling server-side and rejects overrides.
    providers:
      - provider: kimi
        model: k3-256k
        api_key_env: KIMI_API_KEY
        base_url: https://api.kimi.com/coding/v1

  # MiniMax M3 on the MiniMax coding plan (`sk-cp-…` key, CN endpoint).
  # Natively multimodal: `vision: true` makes chat inline attached images
  # straight into the payload instead of routing them through analyze_image.
  minimax-m3:
    name: MiniMax M3
    context_window: 524288
    vision: true
    options:
      thinking: true
      temperature: 1.0
      max_tokens: 20000
    providers:
      - provider: minimax
        model: MiniMax-M3
        api_key_env: MINIMAX_API_KEY
        base_url: https://api.minimaxi.com/v1

# ─── Chat model picker ────────────────────────────────────
# Which models a user may switch between in Chat, in the order the picker shows
# them. A model whose providers all lack their env vars is filtered out at read
# time, so the optional entries stay invisible until configured.
#
# There is no `default` here: the default is the agent's own `model.id`
# (profiles/sprouty.yaml), which is also what every headless path uses —
# scheduled tasks, eval runs, workflow nodes and spawned sub-sessions never
# send a model.
chat:
  selectable:
    - flash
    - pro
    - deepseek-flash
    - deepseek-pro
    - kimi-k3
    - minimax-m3

# ─── Outbound relay (/api/llm) ────────────────────────────
# Which of the models above external clients may request, and which one a key
# with no explicit subset gets by default. Subscription-quota models (Kimi,
# MiniMax) stay out unless an admin lists them in a key's `allowed_models`.
relay:
  default: flash
  public:
    - flash
    - pro
    - deepseek-flash
    - deepseek-pro
