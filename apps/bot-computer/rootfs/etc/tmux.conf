# The member's terminal (gh-term): one tmux session `gh`, so a page reload
# reattaches to the same shell. The outer terminal is xterm.js in the browser.

set -g default-terminal "tmux-256color"
set -g history-limit 20000
# vim/less in a web terminal: don't hold Esc back waiting for a key sequence.
set -sg escape-time 10
# Keep scrollback and text selection with the browser's terminal: tmux stays
# off the outer alternate screen (output scrolls into xterm.js's own buffer)
# and mouse mode stays off (a drag selects text the browser can copy).
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -g mouse off

set -g status-style "bg=#1d2b24,fg=#9fb8ab"
set -g status-left "[#S] "
set -g status-right "%H:%M"
set -g window-status-current-style "fg=#ffffff,bold"
